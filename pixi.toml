[workspace]
name = "spatialpandas"
channels = ["pyviz/label/dev", "conda-forge"]
platforms = ["linux-64", "osx-arm64", "win-64"]
preview = ["pixi-build"]
requires-pixi = ">=0.68.1"

[package]
name = "spatialpandas"
version = "9999.0.0" # dynamic versioning: https://github.com/prefix-dev/pixi/issues/5360

[package.build]
backend = { name = "pixi-build-python", version = ">=0.4.4" }

[package.host-dependencies]
hatchling = "*"
hatch-vcs = "*"

[environments]
default = [
    "required",
    "py314",
    "optional",
    "test-core",
    "test-example",
    "test-task",
    "lint",
    "dev",
]

[environments.test-312]
features = ["required", "py312", "optional", "test-core", "test-task", "test-example"]
no-default-feature = true

[environments.test-313]
features = ["required", "py313", "optional", "test-core", "test-task", "test-example"]
no-default-feature = true

[environments.test-314]
features = ["required", "py314", "optional", "test-core", "test-task", "test-example"]
no-default-feature = true

[environments.test-core]
features = ["required", "py314", "test-core", "test-task"]
no-default-feature = true

[environments.build]
features = ["required", "py314", "build"]
no-default-feature = true

[environments.lint]
features = ["lint"]
no-default-feature = true

[feature.required.activation.env]
PYTHONIOENCODING = "utf-8"
USE_PYGEOS = '0'
COVERAGE_CORE = "sysmon"

[feature.required.dependencies]
spatialpandas = { path = "." }
numba = "*"
dask-core = ">=2025.1"
fsspec = "*"
packaging = "*"
pandas = ">=2.0"
pyarrow = ">=14.0.1"
retrying = "*"

[feature.py312.dependencies]
python = "3.12.*"

[feature.py312.activation.env]
COVERAGE_CORE = "sysmon"

[feature.py313.dependencies]
python = "3.13.*"

[feature.py313.activation.env]
COVERAGE_CORE = "sysmon"

[feature.py314.dependencies]
python = "3.14.*"

[feature.py314.activation.env]
COVERAGE_CORE = "sysmon"

[feature.optional.dependencies]
datashader = "*"
descartes = "*"
distributed = "*"
geopandas-base = "*"
hilbertcurve = "*"
holoviews = "*"
matplotlib-base = "*"
moto = "*"
platformdirs = "*"
pyogrio = "*"
python-snappy = "*"
requests = "*"
rtree = "*"
s3fs = ">=2022.8"
scipy = "*"
shapely = "*"

[feature.dev.dependencies]
jupyterlab = "*"
jupyterlab-myst = "*"
pip = "*"
setuptools_scm = "*"

[feature.dev.tasks]
lab = 'jupyter lab'
setup-dev = { depends-on = ["lint-install"] }

# =============================================
# =================== TESTS ===================
# =============================================
[feature.test-core.dependencies]
hypothesis = "*"
psutil = "*"
pytest = "*"
pytest-cov = "*"
pytest-github-actions-annotate-failures = "*"
pytest-xdist = "*"

[feature.test-task.tasks]
test-unit = 'pytest spatialpandas/tests -n logical --dist loadgroup'

[feature.test-example.dependencies]
nbval = "*"

[feature.test-example.activation.env]
DASK_SCHEDULER = "single-threaded"
MALLOC_TRIM_THRESHOLD_ = '0'

[feature.test-example.tasks]
test-example = 'pytest -n logical --dist loadscope --nbval-lax examples'

# =============================================
# ================== BUILD ====================
# =============================================
[feature.build.dependencies]
python-build = "*"
conda-build = "*"

[feature.build.tasks]
build-conda = 'bash scripts/conda/build.sh'
build-pip = 'python -m build .'

# =============================================
# =================== LINT ====================
# =============================================
[feature.lint.dependencies]
prek = "*"

[feature.lint.tasks]
lint = 'prek run --all-files'
lint-install = 'prek install'
