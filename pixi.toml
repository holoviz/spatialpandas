[workspace]
name = "spatialpandas"
channels = ["pyviz/label/dev", "conda-forge"]
platforms = ["linux-64", "osx-arm64", "win-64"]

[tasks]
install = 'python -m pip install --no-deps --disable-pip-version-check -e .'

[activation.env]
PYTHONIOENCODING = "utf-8"
USE_PYGEOS = '0'
COVERAGE_CORE = "sysmon"

[environments]
test-312 = ["py312", "optional", "test-core", "test-task", "test-example"]
test-313 = ["py313", "optional", "test-core", "test-task", "test-example"]
test-314 = ["py314", "optional", "test-core", "test-task", "test-example"]
test-core = ["py314", "test-core", "test-core-task"]
build = ["py314", "build"]
lint = ["lint"]

[dependencies]
numba = "*"
dask-core = ">=2025.1"
fsspec = "*"
packaging = "*"
pandas = ">=2.0"
pip = "*"
pyarrow = ">=14.0.1"
retrying = "*"

[feature.py312.dependencies]
python = "3.12.*"

[feature.py312.activation.env]
COVERAGE_CORE = "sysmon"

[feature.py313.dependencies]
python = "3.13.*"

[feature.py313.activation.env]
COVERAGE_CORE = "sysmon"

[feature.py314.dependencies]
python = "3.14.*"

[feature.py314.activation.env]
COVERAGE_CORE = "sysmon"

[feature.optional.dependencies]
datashader = "*"
descartes = "*"
distributed = "*"
geopandas-base = "*"
hilbertcurve = "*"
holoviews = "*"
matplotlib-base = "*"
moto = "*"
platformdirs = "*"
pyogrio = "*"
python-snappy = "*"
requests = "*"
rtree = "*"
s3fs = ">=2022.8"
scipy = "*"
shapely = "*"

# =============================================
# =================== TESTS ===================
# =============================================
[feature.test-core.dependencies]
hypothesis = "*"
psutil = "*"
pytest = "*"
pytest-cov = "*"
pytest-github-actions-annotate-failures = "*"
pytest-xdist = "*"

[feature.test-core-task.tasks]
test-unit = 'pytest spatialpandas/tests -n logical --dist loadgroup --skip-slow'

[feature.test-task.tasks]
test-unit = 'pytest spatialpandas/tests -n logical --dist loadgroup'

[feature.test-example.dependencies]
nbval = "*"

[feature.test-example.activation.env]
DASK_SCHEDULER = "single-threaded"
MALLOC_TRIM_THRESHOLD_ = '0'

[feature.test-example.tasks]
test-example = 'pytest -n logical --dist loadscope --nbval-lax examples'

# =============================================
# ================== BUILD ====================
# =============================================
[feature.build.dependencies]
python-build = "*"
conda-build = "*"

[feature.build.tasks]
build-conda = 'bash scripts/conda/build.sh'
build-pip = 'python -m build .'

# =============================================
# =================== LINT ====================
# =============================================
[feature.lint.dependencies]
prek = "*"

[feature.lint.tasks]
lint = 'prek run --all-files'
lint-install = 'prek install'
